name: Bug report
description: Report a reproducible problem in GeoFusion
title: "bug: "
body:
  - type: markdown
    attributes:
      value: |
        Do not include operational records, personal data, credentials, or private paths. For security issues, follow [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the command, sanitized input shape, and relevant logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: e.g. git commit SHA
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python version, operating system, and dependency installation details.
